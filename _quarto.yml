project:
  type: book
  output-dir: docs
  
book:
  author: 
    - name: "Elliot Gould"
      affiliations:
        - name: "University of Melbourne"
          address: "Parkville, Victoria, Australia"
          department: "School of Agriculture Food and Ecosystem Sciences"
  date: last-modified
  chapters:
    - index.qmd
    - part: "Part I: Researcher Degrees of Freedom"
      chapters:
      - RDF_QRP.qmd
    - part: "Part II: Adaptive Preregistration"
      chapters:
        - adaptive_preregistration_background.qmd
        - adaptive_preregistration_implementation.qmd
  repo-url: https://github.com/egouldo/EcoConsPreReg/
  repo-branch: master
  repo-actions: [edit, issue]
  reader-mode: true
  page-footer: "Copyright 2025, Elliot Gould"
  back-to-top-navigation: true
  navbar:
    search: true
    left:
      - href: index.qmd
        text: Home
      - text: "Researcher Degrees of Freedom"
        file: RDF_QRP.qmd
      - text: "Adaptive Preregistration"
        menu: 
          - adaptive_preregistration_background.qmd
          - adaptive_preregistration_implementation.qmd
      - text: "Preregistration Template for Modelling"
        file: preregistration_modelling.qmd
      - icon: github
        menu:
          - text: Source Code
            url: https://github.com/egouldo/EcoConsPreReg
          - text: Report a Bug
            url:  https://github.com/egouldo/EcoConsPreReg/issues/new
  sidebar:
    - title: "Researcher Degrees of Freedom"
      contents:
        - RDF_QRP.qmd
        # navigation items
    - title: "Adaptive Preregistration"
      style: "docked"
      background: light
      contents:
        - adaptive_preregistration_background.qmd
        - adaptive_preregistration_implementation.qmd
    - title: "Preregistration Template for Ecological Modelling" 
      contents:
        - preregistration_modelling.qmd
  
format: 
  html:
    # theme: flatly
    css: styles.css
    toc: true
    default: true
  titlepage-pdf:
    titlepage: classic-lined
    toc: true
    number-sections: true
    documentclass: scrbook
    classoption: ["oneside", "open=any"]
    papersize: A4
    default: true
    colorlinks: true
    title: "Adaptive Preregistration for Model-Based Research"
    subtitle: "A guide and template for preregistering ecological models"
    citeproc: true
    bibliography: references.bib
    csl: methods-in-ecology-and-evolution.csl
    
editor: visual
